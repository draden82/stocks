 const R=['strongBuy','buy','hold','sell','strongSell'],RL=['Strong buy','Buy','Hold','Sell','Strong sell'],rc=R.map(k=>ts.reduce((s,t)=>s+((ex(t).rec||{})[k]||0),0)),rt=rc.reduce((a,b)=>a+b,0)||1,

// ---- quarterly results vs expectations
const qk=d=>{const y=+d.slice(0,4),m=+d.slice(5,7);return m<=3?[y-1,4]:m<=6?[y,1]:m<=9?[y,2]:[y,3]};

 const cell=o=>{if(!o)return`<td style='background:#171f30'></td>`;const r=o.b/o.n,a=(.15+Math.min(Math.abs(r-.5)*1.4,.65)).toFixed(2);return`<td style='background:rgba(${r>=.5?'61,220,151':'255,107,107'},${a})' title='median surprise ${pc(o.md)}'>${o.b}/${o.n}<br><span style='font-weight:400;opacity:.85'>${pc(o.md)}</span></td>`};
 const blk=(f,ttl)=>{const Q=qdata(ts,f);if(!Q.length)return`<p class='sub' style='margin:18px 0 4px'>${ttl}</p><p class='mu' style='font-size:13px'>No data yet. ${f=='rq'?'Revenue expectations are recorded on each daily run and compared with the actual once a stock reports, so this fills in during the next report season.':'Run the updated fetch_prices.py.'}</p>`;
  const ys=[...new Set(Q.map(o=>o.y))].sort().reverse();

 return blk('eq','EPS VS EXPECTATIONS · STOCKS THAT BEAT, WITH MEDIAN SURPRISE')+blk('rq','REVENUE VS EXPECTATIONS · STOCKS THAT BEAT, WITH MEDIAN SURPRISE')+`<p class='sub'>Each stock counts once per quarter, by report date (January to March reports are Q4 of the prior year). Dots on the price chart mark the median report date: green when most stocks beat, red when most missed.</p>`}
// ---- monthly returns
function mret(c,ds){const me=[];ds.forEach((d,i)=>{const k=d.slice(0,7);if(me.length&&me[me.length-1][0]==k)me[me.length-1][1]=c[i];else me.push([k,c[i]])});
 const Y={};for(let i=1;i<me.length;i++){const[y,m]=me[i][0].split('-');(Y[y]=Y[y]||{})[+m-1]=me[i][1]/me[i-1][1]-1}
 const ys=Object.keys(Y).sort().reverse(),M='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' '),f=v=>(v>=0?'+':'')+(v*100).toFixed(1)+'%',
 bg=v=>v==null?'#171f30':`rgba(${v>=0?'61,220,151':'255,107,107'},${(.15+Math.min(Math.abs(v)*3.5,.7)).toFixed(2)})`,

 const yr=y=>{const a=Object.values(Y[y]);return a.reduce((p,v)=>p*(1+v),1)-1},
 avg=m=>{const a=ys.map(y=>Y[y][m]).filter(v=>v!=null);return a.length?a.reduce((p,v)=>p+v)/a.length:null};
 return`<p class="sub" style="margin:18px 0 4px">MONTHLY RETURNS · % · FULL HISTORY OF THE INDEX</p><div class="mr"><table><tr><th></th>${M.map(m=>`<th>${m}</th>`).join('')}<th>Year</th></tr>
 ${ys.map(y=>`<tr><th>${y}</th>${M.map((_,m)=>{const v=Y[y][m];return`<td style="background:${bg(v)}">${v==null?'':(v*100).toFixed(1)+'%'}</td>`}).join('')}${tc(yr(y))}</tr>`).join('')}
 <tr><th>Avg</th>${M.map((_,m)=>{const v=avg(m);return v==null?'<td></td>':tc(v)}).join('')}<td></td></tr></table></div>`}

function rangeIx(ds,L){let s=Math.max(0,L+1-(WK?156:252)),e=L;if(RNG.p!='auto'){let f=RNG.f,t=RNG.t||ds[L];if(RNG.p!='custom'){t=ds[L];if(RNG.p=='Max')f='';else{const d=new Date(ds[L]),n=+RNG.p.slice(0,-1);RNG.p.slice(-1)=='M'?d.setUTCMonth(d.getUTCMonth()-n):d.setUTCFullYear(d.getUTCFullYear()-n);f=d.toISOString().slice(0,10)}}
 s=f?ds.findIndex(d=>d>=f):0;if(s<0)s=0;e=ds.map(d=>d<=t).lastIndexOf(true);if(e<0)e=L;if(e-s<10)s=Math.max(0,e-10)}return[s,e]}

function vhist(k,ts,w){const H=DATA.hist;if(!H)return'<p class="sub">No history in the loaded data. Run the updated fetch_prices.py and reload.</p>';

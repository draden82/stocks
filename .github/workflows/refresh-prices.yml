# Save as .github/workflows/refresh-prices.yml in the repo that hosts the page.
# Put spotlight-sweden.html (renamed index.html), fetch_prices.py and optionally config.json in the repo root,
# then enable GitHub Pages. prices.json is rebuilt every weekday after the Stockholm close.
name: refresh-prices
on:
  schedule: [{cron: "45 16 * * 1-5"}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas
      - run: python fetch_prices.py $(test -f config.json && echo config.json)
      - run: |
          git config user.name "price-bot" && git config user.email "bot@users.noreply.github.com"
          git add prices.json && git commit -m "Refresh prices" || exit 0
          git push
